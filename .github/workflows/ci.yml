name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Engine Guard packages do not depend on the caller's umask
        run: |
          (umask 022; sh engine-guard/build.sh "$RUNNER_TEMP/eg022" >/dev/null)
          (umask 002; sh engine-guard/build.sh "$RUNNER_TEMP/eg002" >/dev/null)
          diff -r "$RUNNER_TEMP/eg022" "$RUNNER_TEMP/eg002"
      - name: Engine Guard hook against recorded and real apt (v3 records)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sh engine-guard/test.sh
      - name: vendor directory is in sync with go.mod
        run: |
          go mod vendor
          git diff --exit-code -- vendor go.mod go.sum
          go mod verify
      - name: compatibility matrix is rendered from compatibility.json
        run: python3 docs/nextgen/render_matrix.py --check

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install talloc headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libtalloc-dev
      - name: Build host PRoot (termux/proot at Garden's pin)
        run: scripts/build-host-proot.sh "$RUNNER_TEMP/proot"
      - name: Unit, security and runtime tests (race detector)
        env:
          THOTHDOCK_TEST_PROOT: ${{ runner.temp }}/proot/proot
        run: go test -race -count=1 ./...

  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build linux/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath -ldflags "-s -w -X github.com/Lord1Egypt/ThothDock/internal/version.GitCommit=${GITHUB_SHA::7}" -o thothdock-linux-${{ matrix.goarch }} ./cmd/thothdock
          file thothdock-linux-${{ matrix.goarch }}

  smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install talloc headers
        run: sudo apt-get update -q && sudo apt-get install -y -q libtalloc-dev
      - name: Build
        run: |
          scripts/build-host-proot.sh "$RUNNER_TEMP/proot"
          go build -o "$RUNNER_TEMP/thothdock" ./cmd/thothdock
      - name: Docker CLI against ThothDock (no dockerd involved)
        env:
          SMOKE_PULL: "1"
          SMOKE_GUARD: "1"
        run: |
          docker --version
          tests/smoke/docker-cli-smoke.sh "$RUNNER_TEMP/thothdock" "$RUNNER_TEMP/proot/proot"

  # Networks, Compose and restart policies need Garden's PRoot with patch
  # 0009 (--net-ip), built from AndroidThothTerm at a pinned commit by its own
  # host check, which also tests the patch.
  nextgen:
    runs-on: ubuntu-24.04
    env:
      GARDEN_COMMIT: c149f1263ee7ee8741d189f0b0e69e09de94310b
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/checkout@v6
        with:
          repository: Lord1Egypt/AndroidThothTerm
          ref: ${{ env.GARDEN_COMMIT }}
          path: garden
          submodules: false
      - name: Garden PRoot (patches 0001-0009) and its --net-ip host check
        run: |
          git -C garden submodule update --init --depth 1 third_party/proot
          mkdir -p "$RUNNER_TEMP/gp"
          WORK="$RUNNER_TEMP/gp" sh garden/tests/garden-common/proot/net-ip-check.sh
          cp "$RUNNER_TEMP/gp/proot/src/proot" "$RUNNER_TEMP/garden-proot"
      - name: Build ThothDock
        run: go build -o "$RUNNER_TEMP/thothdock" ./cmd/thothdock
      - name: Restart policies and events (stock Docker CLI)
        run: tests/regression/restart-policies.sh "$RUNNER_TEMP/thothdock" "$RUNNER_TEMP/garden-proot"
      - name: User-defined networks (stock Docker CLI)
        run: tests/regression/networks.sh "$RUNNER_TEMP/thothdock" "$RUNNER_TEMP/garden-proot"
      - name: Docker Compose
        run: |
          docker compose version
          tests/regression/compose.sh "$RUNNER_TEMP/thothdock" "$RUNNER_TEMP/garden-proot"
