name: mosquitto
version: 2.1.2
summary: Eclipse Mosquitto MQTT broker
description: This is a message broker that supports version 5.0, 3.1.1, and 3.1 of
  the MQTT protocol. MQTT provides a method of carrying out messaging using a publish/subscribe
  model. It is lightweight, both in terms of bandwidth usage and ease of implementation.
  This makes it particularly useful at the edge of the network where a sensor or other
  simple device may be implemented using a microcontroller for example.
architectures:
- arm64
base: core24
apps:
  mosquitto:
    command: launcher.sh
    daemon: simple
    restart-condition: always
    plugs:
    - home
    - network
    - network-bind
  ctrl:
    command: usr/bin/mosquitto_ctrl
    plugs:
    - home
    - network
  pub:
    command: usr/bin/mosquitto_pub
    plugs:
    - home
    - network
  rr:
    command: usr/bin/mosquitto_rr
    plugs:
    - home
    - network
  signal:
    command: usr/bin/mosquitto_signal
    plugs:
    - home
    - network
  sub:
    command: usr/bin/mosquitto_sub
    plugs:
    - home
    - network
  passwd:
    command: usr/bin/mosquitto_passwd
    plugs:
    - home
confinement: strict
grade: stable
environment:
  LD_LIBRARY_PATH: ${SNAP_LIBRARY_PATH}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}:$SNAP/usr/lib:$SNAP/usr/lib/aarch64-linux-gnu
  PATH: $SNAP/usr/sbin:$SNAP/usr/bin:$SNAP/sbin:$SNAP/bin:$PATH
